name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    uses: getkirby/actions/.github/workflows/php.yml@5a2291a578b5304133b7e3106f3bb92f9385bea0 # 0.1.0
    with:
      # the fixer refuses PHP versions that it doesn't support yet,
      # which the tests cover on purpose
      env: PHP_CS_FIXER_IGNORE_ENV=1
      extensions: mbstring
      suggestions: true
    permissions:
      contents: read
      # for the code style suggestions on pull requests
      pull-requests: write
